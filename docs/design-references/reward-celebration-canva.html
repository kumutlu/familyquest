  <style>
    :root {
      --ink: #18233f;
      --navy: #132041;
      --cream: #fffaf0;
      --coral: #ff6b54;

      --sky: #75d7ff;
    }

    * { box-sizing: border-box; }

    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      font-family: "DM Sans", sans-serif;
      color: var(--ink);
      overflow-x: hidden;
    }

    button, input { font: inherit; }

    button:focus-visible {
      outline: 4px solid rgba(19, 32, 65, .28);

    }

    .reward-shell {

    .reward-shell::before,

    .gift-bow {

    .gift-bow::before { left: -1px; transform: rotate(23deg); }

    .awesome-button {

    .celebration-overlay.is-ready .awesome-button { opacity: 1; transform: translateY(0); }

    .awesome-button:active { transform: translateY(4px); border-bottom-width: 2px; }

    @keyframes card-enter { from { opacity: 0; transform: translateY(20px) scale(.98); } to { opacity: 1; transform: none; } }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 520px) {

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }

  <script src="/_sdk/fef09cb5f5b2424b.editing_sdk.js" integrity="sha512-PbmCvZWt+xecnQll4ofK5HTtTS+pGwwY1xn9+p49qHgEHml+uvyc0o1f2Eltkd4t324iwgnf7acUjfnKHkik1w=="></script>
  <script>
    const redeemButton = document.getElementById('redeem-button');
    const errorMessage = document.getElementById('error-message');
    const overlay = document.getElementById('celebration-overlay');
    const awesomeButton = document.getElementById('awesome-button');
    const pointsBefore = document.getElementById('points-before');
    const pointsAfter = document.getElementById('points-after');
    const currentPoints = document.getElementById('current-points');
    const canvas = document.getElementById('confetti-canvas');
    const context = canvas.getContext('2d');
    let activeElementBeforeOverlay = null;
    let animationFrame = null;
    let particles = [];

    /*
      Replace only this promise call with the existing redemption request.
      CelebrationOverlay.open() is intentionally called only after a successful resolution.
    */
    function requestRedemption() {
      return new Promise((resolve) => {
        window.setTimeout(resolve, 850);
      });
    }

    const CelebrationOverlay = {
      open({ beforePoints, afterPoints }) {
        activeElementBeforeOverlay = document.activeElement;
        pointsBefore.textContent = String(beforePoints);
        pointsAfter.textContent = String(afterPoints);

        overlay.classList.remove('is-revealed', 'is-ready');
        overlay.classList.add('is-open');
        overlay.setAttribute('aria-hidden', 'false');
        startConfetti();
        playSuccessSound();

        window.setTimeout(() => overlay.classList.add('is-revealed'), 420);
        window.setTimeout(() => {
          overlay.classList.add('is-ready');
          awesomeButton.focus();
        }, 2350);
      },

      close() {
        overlay.classList.remove('is-open', 'is-revealed', 'is-ready');
        overlay.setAttribute('aria-hidden', 'true');
        stopConfetti();
        if (activeElementBeforeOverlay) activeElementBeforeOverlay.focus();
      }
    };

    redeemButton.addEventListener('click', async () => {
      const beforePoints = 250;
      const afterPoints = 225;

      errorMessage.classList.remove('is-visible');
      redeemButton.disabled = true;
      redeemButton.classList.add('is-loading');

      try {
        await requestRedemption();
        currentPoints.textContent = afterPoints + ' points';
        CelebrationOverlay.open({ beforePoints, afterPoints });
      } catch (error) {
        errorMessage.classList.add('is-visible');
      } finally {
        redeemButton.disabled = false;
        redeemButton.classList.remove('is-loading');
      }
    });

    awesomeButton.addEventListener('click', () => CelebrationOverlay.close());

    document.addEventListener('keydown', (event) => {
      if (!overlay.classList.contains('is-open')) return;

      if (event.key === 'Escape') {
        event.preventDefault();
        CelebrationOverlay.close();
        return;
      }

      if (event.key === 'Tab') {
        event.preventDefault();
        awesomeButton.focus();
      }
    });

    function resizeCanvas() {
      const ratio = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * ratio;
      canvas.height = window.innerHeight * ratio;
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    function startConfetti() {
      resizeCanvas();
      const colors = ['#ff6b54', '#ffc84a', '#32d1a0', '#75d7ff', '#ffffff', '#a983ff'];
      particles = Array.from({ length: 170 }, (_, index) => ({
        x: Math.random() * window.innerWidth,
        y: -30 - Math.random() * window.innerHeight * .45,
        size: 6 + Math.random() * 8,
        color: colors[index % colors.length],
        vx: -2.5 + Math.random() * 5,
        vy: 2.4 + Math.random() * 4.6,
        rotation: Math.random() * Math.PI,
        rotationSpeed: -.16 + Math.random() * .32,
        gravity: .075 + Math.random() * .07,
        shape: Math.random() > .22 ? 'rect' : 'circle'
      }));
      cancelAnimationFrame(animationFrame);
      animateConfetti();
    }

    function animateConfetti() {
      context.clearRect(0, 0, window.innerWidth, window.innerHeight);
      particles.forEach((particle) => {
        particle.x += particle.vx;
        particle.y += particle.vy;
        particle.vy += particle.gravity;
        particle.rotation += particle.rotationSpeed;

        context.save();
        context.translate(particle.x, particle.y);
        context.rotate(particle.rotation);
        context.fillStyle = particle.color;

        if (particle.shape === 'circle') {
          context.beginPath();
          context.arc(0, 0, particle.size * .55, 0, Math.PI * 2);
          context.fill();
        } else {
          context.fillRect(-particle.size / 2, -particle.size * .3, particle.size, particle.size * .6);
        }
        context.restore();
      });

      particles = particles.filter((particle) => particle.y < window.innerHeight + 36);
      if (particles.length) animationFrame = requestAnimationFrame(animateConfetti);
    }

    function stopConfetti() {
      cancelAnimationFrame(animationFrame);
      particles = [];
      context.clearRect(0, 0, window.innerWidth, window.innerHeight);
    }

    function playSuccessSound() {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;

        const audioContext = new AudioContextClass();
        const now = audioContext.currentTime;
        const notes = [
          { frequency: 523.25, time: now, duration: .11 },
          { frequency: 659.25, time: now + .11, duration: .12 },
          { frequency: 783.99, time: now + .23, duration: .24 }
        ];

        notes.forEach((note) => {
          const oscillator = audioContext.createOscillator();
          const gain = audioContext.createGain();
          oscillator.type = 'sine';
          oscillator.frequency.setValueAtTime(note.frequency, note.time);
          gain.gain.setValueAtTime(.0001, note.time);
          gain.gain.exponentialRampToValueAtTime(.12, note.time + .02);
          gain.gain.exponentialRampToValueAtTime(.0001, note.time + note.duration);
          oscillator.connect(gain);
          gain.connect(audioContext.destination);
          oscillator.start(note.time);
          oscillator.stop(note.time + note.duration + .03);
        });

        window.setTimeout(() => audioContext.close(), 900);
      } catch (_) {
        /* Sound is an enhancement; the visual celebration remains fully functional. */
      }
    }

    window.addEventListener('resize', () => {
      if (overlay.classList.contains('is-open')) resizeCanvas();
    });

    lucide.createIcons();
  </script>

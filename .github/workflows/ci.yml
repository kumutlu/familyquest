name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  freeze-guard:
    name: Gamification V4 freeze guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reject new legacy gamification writers
        run: node scripts/gamification-freeze-guard.cjs --check

  hold-to-complete-regression:
    name: Hold-to-complete regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx vitest run src/components/quests/HoldToCompleteButton.test.tsx

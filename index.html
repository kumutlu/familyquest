<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- Appearance bootstrap: apply the persisted Light/Dark/System preference
         BEFORE first paint to prevent a theme flash. System follows the OS
         prefers-color-scheme. This runs synchronously in head and never depends
         on the service worker. -->
    <script>
      (function () {
        try {
          var stored = null;
          try { stored = localStorage.getItem('queki:appearance'); } catch (e) {}
          var appearance = stored === 'light' || stored === 'dark' ? stored : 'system';
          var systemDark = false;
          try {
            systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          } catch (e) {}
          var dark = appearance === 'dark' || (appearance === 'system' && systemDark);
          var root = document.documentElement;
          if (dark) root.classList.add('dark');
          root.style.colorScheme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#0e1116' : '#0f766e');
        } catch (e) {}
      })();
    </script>

    <title>Queki — Family tasks, rewards & pocket money</title>
    <meta name="description" content="Queki helps your family share tasks, earn rewards and track pocket money in one place." />
    <link rel="canonical" href="https://queki.app/" />

    <!-- Open Graph / Social. Absolute HTTPS URLs on the canonical production
         domain (queki.app) so WhatsApp, iMessage and Slack can fetch the card. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://queki.app/" />
    <meta property="og:site_name" content="Queki" />
    <meta property="og:title" content="Queki — Family tasks, rewards & pocket money" />
    <meta property="og:description" content="Queki helps your family share tasks, earn rewards and track pocket money in one place." />
    <meta property="og:image" content="https://queki.app/og/queki-og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Queki" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Queki — Family tasks, rewards & pocket money" />
    <meta name="twitter:description" content="Queki helps your family share tasks, earn rewards and track pocket money in one place." />
    <meta name="twitter:image" content="https://queki.app/og/queki-og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
